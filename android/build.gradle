plugins {
    id 'com.android.application' version '8.6.0'
}

android {
    namespace 'org.openbgi'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openbgi'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['../obj/android-app/package/lib']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('../obj/android-app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
